<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ali Iftikhar — Full-Stack Engineer, Backend Lead, Mentor">
  <defs>
    <style>
      @font-face { font-family: 'InterLight'; font-weight: 300; src: url(data:font/woff2;base64,) format('woff2'); }
      .name { font-family: 'InterLight', 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -1.5px; fill: #ffffff; }
      .sub { font-family: 'InterLight', 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 22px; letter-spacing: 1px; fill: #cbd5e1; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <text x="600" y="123" text-anchor="middle" class="name">Ali Iftikhar</text>
  <text x="600" y="173" text-anchor="middle" class="sub">Full-Stack Engineer · Backend Lead · Mentor</text>
</svg>
