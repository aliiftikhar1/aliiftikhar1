<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ali Iftikhar — Full-Stack Engineer. Build, ship and scale web products.">
  <defs>
    <style>
      @font-face { font-family: 'InterLight'; font-weight: 300; src: url(data:font/woff2;base64,) format('woff2'); }
      .label { font-family:'InterLight','Inter','Helvetica Neue',Arial,sans-serif;font-weight:300; font-size: 13px; letter-spacing: 4px; fill: #d6b4ff; }
      .name { font-family:'InterLight','Inter','Helvetica Neue',Arial,sans-serif;font-weight:300; font-size: 60px; letter-spacing: -1.5px; fill: #ffffff; }
      .accent { font-family:'InterLight','Inter','Helvetica Neue',Arial,sans-serif;font-weight:300; font-size: 60px; letter-spacing: -1.5px; fill: #d6b4ff; }
      .body { font-family:'InterLight','Inter','Helvetica Neue',Arial,sans-serif;font-weight:300; font-size: 18px; letter-spacing: 0.3px; fill: #ffffff; fill-opacity: .68; }
      .pill { font-family:'InterLight','Inter','Helvetica Neue',Arial,sans-serif;font-weight:300; font-size: 12px; letter-spacing: 2.5px; fill: #ffffff; fill-opacity: .85; }
    </style>
    <radialGradient id="g1" cx="0.88" cy="0.1" r="0.6"><stop offset="0" stop-color="#9d72ff" stop-opacity=".38"/><stop offset="1" stop-color="#9d72ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#b992ff" stop-opacity=".16"/><stop offset="1" stop-color="#b992ff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#050014"/>
  <rect width="1200" height="300" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="22" fill="url(#g1)"/>
  <rect width="1200" height="300" rx="22" fill="url(#g2)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
  <circle cx="84" cy="78" r="4.5" fill="#9d72ff"/>
  <text x="102" y="83" class="label">FULL-STACK ENGINEER</text>
  <text x="80" y="150" class="name">Ali Iftikhar</text>
  <text x="80" y="212" class="accent">Build, Ship &amp; Scale Web Products.</text>
  <text x="82" y="252" class="body">Backend Lead · Mentor</text>
  <g>
    <rect x="788" y="246" width="136" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="856" y="267" text-anchor="middle" class="pill">ARCHITECTURE</text>
    <rect x="932" y="246" width="136" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="1000" y="267" text-anchor="middle" class="pill">DEVELOPMENT</text>
    <rect x="1076" y="246" width="96" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="1124" y="267" text-anchor="middle" class="pill">DELIVERY</text>
  </g>
</svg>
